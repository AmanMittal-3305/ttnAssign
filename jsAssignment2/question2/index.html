<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Assignment</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>JS Assignment 2</h1>

    <div class="question">
        <h2>Temperature Converter</h2>

        <form>

            <label>
                Temperature in Celsius:
                <input type="number" id="temperature">
            </label><br><br>

            <button type="button" onclick="readTemperature()" id="read-btn">Read</button>

            <button onclick="convertToFahrenheit()" id="subtract-btn" type="button">Convert to Fahrenheit</button>
            <button onclick="convertToKelvin()" id="mutiply-btn" type="button">Convert to Kelvin</button>
            <button onclick="display()" id="display-btn" type="button">Display</button>
        </form>

        <p class="result"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
